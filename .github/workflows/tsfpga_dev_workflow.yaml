name: tsfpga build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Clean workspace
        run: rm -rf $GITHUB_WORKSPACE/* $GITHUB_WORKSPACE/.[!.]* || true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build with tsfpga
        run: python3 build.py

      - name: Upload bitstream artefact
        uses: actions/upload-artifact@v4
        with:
          name: design.bit
          path: ./vivado_project/output/*.bit

      - name: Unpack xsa artefact
        run: |
          unzip vivado_project/output/*.xsa -d ./vivado_project/output/unpacked_xsa

      - name: Upload hwh artefact
        uses: actions/upload-artifact@v4
        with:
          name: design.hwh
          path: ./vivado_project/output/unpacked_xsa/*.hwh